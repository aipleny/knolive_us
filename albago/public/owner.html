<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script src="/i18n.js"></script><script src="/common.js"></script><script src="/docs.js" defer></script><script src="/owner.js" defer></script><script src="/owner-messages.js" defer></script><title>ALBAGO 알바고</title></head>
<body>
<div class="console">
<aside class="side" aria-label="menu">
  <a class="logo" href="#today"><b>ALBAGO</b><span>알바고</span></a>
  <button class="nav" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-7 9 7v9H3z"/></svg><span data-i18n="TAB_TODAY"></span></button>
  <div class="grp" data-i18n="GRP_PEOPLE"></div>
  <button class="nav" data-tab="staff"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5.5 6.5-5.5s5.7 2 6.5 5.5"/></svg><span data-i18n="TAB_STAFF"></span><span class="badge" id="b-staff" hidden></span></button>
  <button class="nav" data-tab="contract"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h5"/></svg><span data-i18n="TAB_CONTRACT"></span></button>
  <div class="grp" data-i18n="GRP_WORK"></div>
  <button class="nav" data-tab="schedule"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span data-i18n="TAB_SCHEDULE"></span></button>
  <button class="nav" data-tab="records"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span data-i18n="TAB_RECORDS"></span></button>
  <div class="grp" data-i18n="GRP_MONEY"></div>
  <button class="nav" data-tab="payroll"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18"/></svg><span data-i18n="TAB_PAYROLL"></span></button>
  <div class="grp" data-i18n="GRP_STORE"></div>
  <button class="nav" data-tab="messages"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg><span data-i18n="TAB_MESSAGES"></span><span class="badge" id="b-msg" hidden></span></button>
  <button class="nav" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg><span data-i18n="TAB_SETTINGS"></span></button>
  <div class="side-foot"><a class="btn" href="#" id="kiosk-open" data-i18n="KIOSK_OPEN"></a></div>
</aside>
<div class="main">
  <header class="head">
    <h1><span id="page-h"></span><small id="page-date"></small></h1>
    <label class="search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5f6368" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" data-i18n-ph="SEARCH_PH" aria-label="search" autocomplete="off"><div class="search-results" id="q-res" hidden></div></label>
    <button class="avatar" id="me-btn" aria-haspopup="true" aria-label="account"></button>
    <div class="menu-pop" id="me-pop" hidden><div class="who" id="me-who"></div><button class="lang-btn" type="button" style="border:0;border-radius:6px;height:auto"></button><button id="logout" type="button" data-i18n="LOGOUT"></button></div>
  </header>
  <main class="content">
    <section data-panel="today"></section><section data-panel="staff" hidden></section><section data-panel="schedule" hidden></section><section data-panel="records" hidden></section>
    <section data-panel="payroll" hidden></section><section data-panel="messages" hidden></section><section data-panel="contract" hidden></section><section data-panel="settings" hidden></section>
  </main>
</div>
</div>

<dialog id="staff-dlg" style="max-width:min(900px,96vw)"><form id="staff-form"><div class="dlg-body" style="max-height:78vh;overflow:auto">
  <div class="spread" style="margin-bottom:12px"><h2 id="staff-title"></h2><button type="button" class="btn ghost" data-close>✕</button></div>
  <fieldset><legend data-i18n="FS_BASIC"></legend><div class="grid g3">
    <label class="f"><span data-i18n="NAME"></span><input name="name" required></label>
    <label class="f"><span data-i18n="MOBILE"></span><input name="phone" inputmode="tel"></label>
    <label class="f"><span data-i18n="BIRTH"></span><input name="birth" type="date"></label>
    <label class="f"><span data-i18n="GENDER"></span><select name="gender"><option value=""></option><option value="M" data-i18n="MALE"></option><option value="F" data-i18n="FEMALE"></option></select></label>
    <label class="f" style="grid-column:span 2"><span data-i18n="ADDRESS"></span><input name="address"></label>
  </div></fieldset>
  <fieldset><legend data-i18n="FS_NATION"></legend>
    <div class="row" style="margin-bottom:10px"><label class="chk"><input type="radio" name="nationality" value="KR" checked> <span data-i18n="KOREAN"></span></label><label class="chk"><input type="radio" name="nationality" value="FOREIGN"> <span data-i18n="FOREIGNER"></span></label></div>
    <div class="grid g3" id="kr-fields"><label class="f"><span data-i18n="RRN"></span> <small id="rrn-now"></small><input name="rrn" autocomplete="off" placeholder="000000-0000000"></label></div>
    <div class="grid g3" id="fr-fields" hidden>
      <label class="f"><span data-i18n="COUNTRY"></span><input name="country"></label>
      <label class="f"><span data-i18n="ALIEN_NO"></span> <small id="alien-now"></small><input name="alienNo" autocomplete="off"></label>
      <label class="f"><span data-i18n="VISA"></span><input name="visa" list="visa-list" placeholder="D-2"></label>
      <label class="f"><span data-i18n="VISA_EXPIRY"></span><input name="visaExpiry" type="date"></label>
      <label class="f" style="grid-column:span 2"><span data-i18n="HOME_ADDRESS"></span><input name="homeAddress"></label>
    </div>
    <datalist id="visa-list"><option value="D-2"></option><option value="D-4"></option><option value="E-9"></option><option value="H-2"></option><option value="F-2"></option><option value="F-4"></option><option value="F-5"></option><option value="F-6"></option><option value="E-7"></option></datalist>
    <p class="muted" data-i18n="PII_NOTE"></p>
  </fieldset>
  <fieldset><legend data-i18n="FS_EMERGENCY"></legend><div class="grid g3">
    <label class="f"><span data-i18n="NAME"></span><input name="emergencyName"></label><label class="f"><span data-i18n="RELATION"></span><input name="emergencyRelation"></label><label class="f"><span data-i18n="PHONE"></span><input name="emergencyPhone" inputmode="tel"></label>
  </div></fieldset>
  <fieldset><legend data-i18n="FS_WORK"></legend><div class="grid g3">
    <label class="f"><span data-i18n="PAY_TYPE"></span><select name="payType"><option value="hourly" data-i18n="PT_HOURLY"></option><option value="monthly" data-i18n="PT_MONTHLY"></option></select></label>
    <label class="f" id="l-hourly"><span data-i18n="WAGE"></span><input name="hourlyWage" type="number" min="0" step="1"></label>
    <label class="f" id="l-monthly" hidden><span data-i18n="MONTHLY_SALARY"></span><input name="monthlySalary" type="number" min="0" step="1"></label>
    <label class="f" id="l-mhours" hidden><span data-i18n="MONTHLY_HOURS"></span><input name="monthlyHours" type="number" min="0" step="1"></label>
    <label class="f"><span data-i18n="WEEKLY_HOLIDAY"></span><select name="weeklyHoliday" id="weekly-holiday"></select></label>
    <label class="f"><span data-i18n="START_DATE"></span><input name="startDate" type="date"></label>
    <label class="f"><span data-i18n="END_DATE"></span><input name="endDate" type="date"></label>
    <label class="f"><span data-i18n="POSITION"></span><input name="position"></label>
    <label class="f"><span data-i18n="HEALTH_CERT"></span><input name="healthCert" type="date"></label>
    <label class="f"><span data-i18n="ALLOWANCE"></span><input name="monthlyAllowance" type="number" min="0" step="1"></label>
    <label class="f" style="grid-column:1/-1"><span data-i18n="JOB_DESC"></span><input name="jobDesc"></label>
  </div><p class="muted" id="minwage-hint"></p></fieldset>
  <fieldset><legend data-i18n="FS_PATTERN"></legend><p class="muted" data-i18n="PATTERN_HELP" style="margin-bottom:8px"></p><div id="pattern" class="grid" style="gap:6px"></div></fieldset>
  <fieldset><legend data-i18n="FS_PAY"></legend><div class="grid g3">
    <label class="f"><span data-i18n="DEDUCTION"></span><select name="deduction"><option value="none" data-i18n="DED_NONE"></option><option value="3.3" data-i18n="DED_33"></option><option value="insurance" data-i18n="DED_INS"></option></select></label>
    <label class="f"><span data-i18n="NON_TAXABLE"></span><input name="nonTaxable" type="number" min="0" step="1"></label>
    <label class="f"><span data-i18n="INCOME_TAX"></span><input name="incomeTax" type="number" min="0" step="1"></label>
    <label class="f"><span data-i18n="BANK"></span><input name="bank"></label><label class="f"><span data-i18n="ACCOUNT"></span> <small id="acct-now"></small><input name="account" autocomplete="off"></label><label class="f"><span data-i18n="HOLDER"></span><input name="accountHolder"></label>
  </div>
  <div id="ins-box" style="margin-top:10px"><p class="muted" data-i18n="INS_OVERRIDE_HELP"></p><div class="grid g4" style="margin-top:6px">
    <label class="f"><span data-i18n="D_pension"></span><select name="ins_pension"></select></label><label class="f"><span data-i18n="D_health"></span><select name="ins_health"></select></label>
    <label class="f"><span data-i18n="D_employment"></span><select name="ins_employment"></select></label><label class="f"><span data-i18n="D_industrial"></span><select name="ins_industrial"></select></label></div>
    <label class="chk" style="margin-top:8px"><input type="checkbox" name="durunuri"> <span data-i18n="DURUNURI_STAFF"></span></label></div>
  </fieldset>
  <fieldset><legend data-i18n="FS_ACCOUNT"></legend><div class="grid g3">
    <label class="f"><span data-i18n="LOGIN_ID"></span><input name="loginId" autocomplete="off"></label>
    <label class="f"><span data-i18n="NEW_PW"></span> <small data-i18n="PW_SET_HELP"></small><input name="password" type="password" autocomplete="new-password"></label>
    <label class="f"><span data-i18n="KIOSK_PIN"></span> <small id="pin-hint"></small><input name="pin" inputmode="numeric" pattern="\d{4,6}" autocomplete="off"></label>
    <label class="f"><span data-i18n="LANGUAGE"></span><select name="lang"><option value="ko">한국어</option><option value="en">English</option></select></label>
    <label class="f"><span data-i18n="COLOR"></span><input name="color" type="color" value="#2459e0" style="height:44px;padding:4px"></label>
    <label class="f" style="grid-column:1/-1"><span data-i18n="MEMO"></span><textarea name="memo"></textarea></label>
  </div></fieldset>
  <p class="err" id="staff-err"></p>
</div><div class="dlg-foot"><button type="button" class="btn danger" id="staff-delete" data-i18n="DELETE"></button><button type="button" class="btn" id="staff-status"></button><span style="flex:1"></span><button type="button" class="btn" data-close data-i18n="CANCEL"></button><button class="btn primary" data-i18n="SAVE"></button></div></form></dialog>

<dialog id="shift-dlg"><div class="dlg-body">
  <h2 id="shift-title"></h2>
  <div class="grid g2" style="margin-top:12px"><label class="f"><span data-i18n="START"></span><input type="time" id="sh-start"></label><label class="f"><span data-i18n="END"></span><input type="time" id="sh-end"></label></div>
  <div style="margin-top:10px"><span class="muted" data-i18n="BREAK_TIMES"></span><div id="sh-breaks" class="grid" style="gap:6px;margin-top:6px"></div><button type="button" class="btn small" id="sh-add-brk" style="margin-top:6px" data-i18n="ADD_BREAK"></button></div>
  <p class="err" id="sh-err"></p>
</div><div class="dlg-foot"><button type="button" class="btn danger" id="sh-off" data-i18n="SET_OFF"></button><span style="flex:1"></span><button type="button" class="btn" data-close data-i18n="CANCEL"></button><button type="button" class="btn primary" id="sh-save" data-i18n="SAVE"></button></div></dialog>

<dialog id="rec-dlg"><div class="dlg-body">
  <h2 id="rec-title"></h2>
  <div class="grid g2" style="margin-top:12px">
    <label class="f"><span data-i18n="STAFF"></span><select id="rec-staff"></select></label><label class="f"><span data-i18n="WORK_DATE"></span><input type="date" id="rec-date"></label>
    <label class="f"><span data-i18n="IN"></span><input type="time" id="rec-in"></label><label class="f"><span data-i18n="OUT"></span><input type="time" id="rec-out"></label>
  </div>
  <div style="margin-top:10px"><span class="muted" data-i18n="ACTUAL_BREAKS"></span><div id="rec-breaks" class="grid" style="gap:6px;margin-top:6px"></div><button type="button" class="btn small" id="rec-add-brk" style="margin-top:6px" data-i18n="ADD_BREAK"></button></div>
  <div class="grid g2" style="margin-top:10px"><label class="f"><span data-i18n="BREAK_MIN_MANUAL"></span><input type="number" id="rec-brk" min="0" step="5"></label><label class="f"><span data-i18n="NOTE"></span><input id="rec-note"></label></div>
  <p class="err" id="rec-err"></p>
</div><div class="dlg-foot"><button type="button" class="btn danger" id="rec-delete" data-i18n="DELETE"></button><span style="flex:1"></span><button type="button" class="btn" data-close data-i18n="CANCEL"></button><button type="button" class="btn primary" id="rec-save" data-i18n="SAVE"></button></div></dialog>

<div id="print-area"></div>
</body></html>
