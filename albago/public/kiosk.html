<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css"><script src="/i18n.js"></script><script src="/common.js"></script><title>알바고 출퇴근 기록부</title></head>
<body class="kiosk">
<header class="topbar"><div class="brand"><img src="/icon.svg" alt=""><div><span data-i18n="KIOSK_TITLE"></span> <span class="sub" id="store"></span></div></div>
<div class="row"><button class="lang-btn" type="button"></button><div><div class="clock" id="clock">--:--</div><div class="date" id="date"></div></div></div></header>
<main class="wrap">
  <section id="unregistered" class="card" hidden><h2 data-i18n="KIOSK_UNREG"></h2><p class="muted" style="margin-top:8px" data-i18n="KIOSK_UNREG_HELP"></p><p style="margin-top:12px"><a class="btn primary" href="/login" data-i18n="LOGIN"></a></p></section>
  <section id="main" hidden>
    <div class="spread section"><h2 data-i18n="KIOSK_TAP"></h2><span class="muted" id="working"></span></div>
    <div class="staff-grid section" id="grid"></div>
    <div class="card section"><h3 data-i18n="THIS_WEEK"></h3><div class="table-wrap" style="margin-top:10px;border:0"><table class="sched" id="week"></table></div></div>
    <p style="text-align:right"><button class="btn small ghost" id="exit" data-i18n="KIOSK_EXIT"></button></p>
  </section>
</main>
<dialog id="dlg"><div class="dlg-body">
  <div class="spread"><h2 id="dlg-name"></h2><button class="btn ghost" id="dlg-close" aria-label="close">✕</button></div>
  <p class="muted" id="dlg-shift"></p>
  <div id="pin-step"><p style="text-align:center;margin:10px 0 0" data-i18n="ENTER_PIN"></p><div class="pin-dots" id="dots"></div><p class="err" id="pin-err" style="text-align:center;min-height:22px;margin:0"></p><div class="pinpad" id="pad"></div></div>
  <div id="act-step" hidden><p id="act-status" style="text-align:center;font-size:17px;margin:14px 0"></p><div class="punch-grid" id="acts"></div></div>
</div></dialog>
<script src="/kiosk.js"></script></body></html>
